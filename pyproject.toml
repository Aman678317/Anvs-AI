[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-ai-meeting-platform"
version = "1.0.0"
description = "Production-grade real-time multilingual AI meeting platform with personalized language translation, WebRTC video/audio, streaming STT, translation, TTS, AI assistance, and enterprise-grade security."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Multilingual AI Meeting Platform Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis[hiredis]>=5.0.3",
    "livekit-api>=0.6.0",
    "livekit-server-sdk>=0.6.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "numpy>=1.26.4",
    "scipy>=1.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.9.0",
    "ruff>=0.3.7",
    "black>=24.3.0",
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.4"
]
ai = [
    "torch>=2.2.2",
    "torchaudio>=2.2.2",
    "faster-whisper>=1.0.1",
    "transformers>=4.40.0",
    "accelerate>=0.29.2",
    "pyannote.audio>=3.1.1",
    "silero-vad>=5.1",
    "TTS>=0.22.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "packages*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH"   # flake8-use-pathlib
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008"  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "livekit.*",
    "pyannote.*",
    "faster_whisper.*",
    "TTS.*",
    "scipy.*",
    "torch.*",
    "torchaudio.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "unit: Isolated unit tests",
    "integration: Multi-service integration tests",
    "contract: API schema and contract tests",
    "realtime: WebRTC and WebSocket real-time tests",
    "ai: Speech, translation, and model evaluation tests",
    "e2e: End-to-end full system tests",
    "security: Security and authorization tests"
]
