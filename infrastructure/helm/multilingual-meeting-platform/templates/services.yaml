# ==============================================================================
# Kubernetes Services (PR-20)
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: {{ include "meeting-platform.fullname" . }}-api
  labels:
    {{- include "meeting-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meeting-platform.fullname" . }}-gateway
  labels:
    {{- include "meeting-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: ws
  selector:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meeting-platform.fullname" . }}-web
  labels:
    {{- include "meeting-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meeting-platform.fullname" . }}-admin
  labels:
    {{- include "meeting-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app.kubernetes.io/component: admin
    app.kubernetes.io/instance: {{ .Release.Name }}
