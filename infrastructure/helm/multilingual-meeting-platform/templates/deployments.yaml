# 4. AI Inference Fleet Workers (STT, NMT, TTS, Speaker, Assistant)
{{- range $workerName, $workerConfig := .Values.aiWorkers }}
{{- if ne $workerName "image" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meeting-platform.fullname" $ }}-worker-{{ $workerName }}
  labels:
    {{- include "meeting-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker-{{ $workerName }}
spec:
  replicas: {{ $workerConfig.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker-{{ $workerName }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker-{{ $workerName }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Values.aiWorkers.image.repository }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            - name: WORKER_TYPE
              value: {{ $workerName | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "meeting-platform.fullname" $ }}-config
          resources:
            {{- toYaml $workerConfig.resources | nindent 12 }}
---
{{- end }}
{{- end }}
