# ==============================================================================
# Centralized ConfigMap and Secrets Template (PR-20)
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "meeting-platform.fullname" . }}-config
  labels:
    {{- include "meeting-platform.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.global.environment | quote }}
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.externalServices.database.user }}@{{ .Values.externalServices.database.host }}:{{ .Values.externalServices.database.port }}/{{ .Values.externalServices.database.name }}"
  REDIS_URL: "redis://{{ .Values.externalServices.redis.host }}:{{ .Values.externalServices.redis.port }}/0"
  LIVEKIT_URL: {{ .Values.externalServices.livekit.url | quote }}
  API_PORT: "8000"
  GATEWAY_PORT: "8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meeting-platform.fullname" . }}-secrets
  labels:
    {{- include "meeting-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  LIVEKIT_API_KEY: {{ .Values.externalServices.livekit.apiKey | quote }}
  JWT_SECRET: "prod_jwt_super_secret_signing_key_replace_in_vault"
