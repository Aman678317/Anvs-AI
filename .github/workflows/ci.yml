name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  lint-and-typecheck-python:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.6.9"

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  lint-and-typecheck-typescript:
    name: TypeScript Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: TypeScript Typecheck
        run: pnpm run typecheck

      - name: Prettier Format Check
        run: pnpm run format:check

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Scan
        run: bandit -r services packages -ll -ii || true

  livekit-egress-integration:
    name: LiveKit Egress Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download & Run LiveKit Server
        run: |
          curl -sSL https://get.livekit.io | bash
          sudo mv livekit-server /usr/local/bin/ || true

      - name: Run LiveKit Egress Tests
        run: |
          pytest tests/integration/test_egress_live_livekit.py -v

  e2e-latency-budget:
    name: E2E Latency Budget (docker-compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start Redis Container
        run: |
          docker run -d --name meeting_redis -p 6379:6379 redis:7.2-alpine

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" redis numpy scipy

      - name: Run Smoke Assertion (PCM reaches Redis & Watermark Drop)
        run: |
          python infrastructure/docker/smoke/run_smoke.py
        env:
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: development

      - name: Run Latency Budget Check
        run: |
          python scripts/ci_latency_budget.py
        env:
          REDIS_URL: redis://localhost:6379/0
          LATENCY_BUDGET_MS: 5000
